# /etc/nginx/sites-available/rasokart-docs.conf
#
# RasoKart Developer Documentation subdomain: docs.rasokart.com
#
# ── Architecture ──────────────────────────────────────────────────────────────
# Cloudflare (Universal SSL) → VPS port 80 → Nginx → upstream
#
#   docs.rasokart.com/              → React SPA /api-docs page
#   docs.rasokart.com/swagger       → Express /api/swagger  (Swagger UI)
#   docs.rasokart.com/openapi.yaml  → Express /api/openapi.yaml
#   docs.rasokart.com/openapi.json  → Express /api/openapi.json
#   docs.rasokart.com/postman       → Static /rasokart.postman_collection.json
#   docs.rasokart.com/api/*         → Express (full API proxy, CORS *)
#   docs.rasokart.com/*             → React SPA (fallback, try_files)
#
# ── SSL notes ─────────────────────────────────────────────────────────────────
# Cloudflare Universal SSL covers *.rasokart.com automatically — no extra
# Let's Encrypt cert is required when the subdomain is Cloudflare-proxied.
#
# If you use Cloudflare SSL mode "Full (strict)" the VPS must present a valid
# cert. Run:
#   sudo certbot certonly --nginx -d docs.rasokart.com
# Then uncomment the SSL server block at the bottom of this file.
#
# ── Deployment ────────────────────────────────────────────────────────────────
# Run scripts/setup-docs-subdomain.sh on the VPS to install this config.
# ─────────────────────────────────────────────────────────────────────────────

upstream rasokart_docs_api {
    server 127.0.0.1:3000;   # Express API (same process as rasokart.com /api/)
    keepalive 16;
}

# ── HTTP server (Cloudflare → VPS, Cloudflare terminates client TLS) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name docs.rasokart.com;

    # Real client IP from Cloudflare proxy header
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # ── Let's Encrypt ACME challenge ──────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Short URL aliases (no /api prefix required on docs domain) ────────────

    # docs.rasokart.com/swagger → Swagger UI
    location = /swagger {
        proxy_pass http://rasokart_docs_api/api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header X-Docs-Subdomain "docs.rasokart.com" always;
    }

    # docs.rasokart.com/openapi.yaml → raw OpenAPI spec
    location = /openapi.yaml {
        proxy_pass http://rasokart_docs_api/api/openapi.yaml;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # docs.rasokart.com/openapi.json → OpenAPI as JSON
    location = /openapi.json {
        proxy_pass http://rasokart_docs_api/api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # docs.rasokart.com/postman → Postman collection download
    location = /postman {
        alias /var/www/rasokart/artifacts/rpay/dist/public/rasokart.postman_collection.json;
        add_header Content-Type "application/json" always;
        add_header Content-Disposition 'attachment; filename="rasokart.postman_collection.json"' always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # docs.rasokart.com/api/* → Express API (full proxy, preserves /api/ prefix)
    location /api/ {
        proxy_pass http://rasokart_docs_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # docs.rasokart.com/robots.txt — allow all crawlers
    location = /robots.txt {
        add_header Content-Type "text/plain" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://docs.rasokart.com/sitemap.xml\n";
    }

    # docs.rasokart.com/sitemap.xml
    location = /sitemap.xml {
        alias /var/www/rasokart/artifacts/rpay/dist/public/docs-sitemap.xml;
        add_header Content-Type "application/xml" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── SPA fallback — serves React app as static files (same root as rasokart.com)
    # docs.rasokart.com/ and all unmatched paths → SPA index.html
    # The React DocsSubdomainRedirect hook detects docs.rasokart.com and navigates / → /api-docs
    root /var/www/rasokart/artifacts/rpay/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # SEO: canonical domain is rasokart.com
        add_header Link '<https://rasokart.com/api-docs>; rel="canonical"' always;
    }
}

# ── HTTPS origin server block ─────────────────────────────────────────────────
# Cloudflare SSL mode is "Full" (non-strict): CF connects to origin port 443
# but does not validate the cert's SAN. We reuse the rasokart.com Let's Encrypt
# cert — Cloudflare accepts it. If mode is upgraded to "Full (Strict)" later,
# run: certbot --expand -d rasokart.com -d www.rasokart.com -d docs.rasokart.com
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.rasokart.com;

    ssl_certificate     /etc/letsencrypt/live/rasokart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rasokart.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Real client IP from Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /swagger {
        proxy_pass http://rasokart_docs_api/api/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header X-Docs-Subdomain "docs.rasokart.com" always;
    }

    location = /openapi.yaml {
        proxy_pass http://rasokart_docs_api/api/openapi.yaml;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /openapi.json {
        proxy_pass http://rasokart_docs_api/api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /postman {
        alias /var/www/rasokart/artifacts/rpay/dist/public/rasokart.postman_collection.json;
        add_header Content-Type "application/json" always;
        add_header Content-Disposition 'attachment; filename="rasokart.postman_collection.json"' always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location /api/ {
        proxy_pass http://rasokart_docs_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host rasokart.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain" always;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://docs.rasokart.com/sitemap.xml\n";
    }

    location = /sitemap.xml {
        alias /var/www/rasokart/artifacts/rpay/dist/public/docs-sitemap.xml;
        add_header Content-Type "application/xml" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    root /var/www/rasokart/artifacts/rpay/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Link '<https://rasokart.com/api-docs>; rel="canonical"' always;
    }
}
