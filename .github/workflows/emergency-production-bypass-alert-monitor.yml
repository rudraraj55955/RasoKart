name: Emergency Production Bypass Alert Monitor

# This workflow is intentionally separate from the weekly integration check.
# If GitHub disables, delays, or never starts that workflow, this monitor can
# still inspect its run history and notify the repository owner.
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    name: Detect stale emergency integration check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert implementation
        uses: actions/checkout@v4

      - name: Alert owner when the scheduled check is stale
        uses: actions/github-script@v7
        with:
          script: |
            const {
              runStaleIntegrationCheck,
            } = require("./.github/scripts/emergency-production-bypass-alert.cjs");
            await runStaleIntegrationCheck({ github, context, core });