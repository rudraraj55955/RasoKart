name: Schema Guard Coverage

# Runs on every pull request and on direct pushes to main.
# Blocks merge when a new pgTable() is added to lib/db/src/schema/
# without a matching CREATE TABLE IF NOT EXISTS guard in either
# artifacts/api-server/src/lib/schemaGuard.ts or scripts/src/db-migrate.ts.
#
# This check is purely static (reads source files only — no database required)
# so it completes in seconds and runs before any expensive build steps.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: schema-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-guard-coverage:
    name: Schema guard coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run schema-guard-coverage
        run: pnpm --filter @workspace/scripts run schema-guard-coverage
