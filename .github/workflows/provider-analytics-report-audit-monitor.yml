name: Provider Analytics Report Audit Monitor
run-name: ${{ inputs.integration_check && 'Provider alert integration check' || 'Provider analytics audit monitor' }}

# This workflow is intentionally separate from the provider report audit.
# It can still inspect audit run history and notify the repository owner when
# GitHub disables, delays, or never starts that scheduled audit.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      integration_check:
        description: "Create, verify, reopen, resolve, and clean up a temporary stale-alert issue"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    name: Detect stale provider analytics report audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert implementation
        uses: actions/checkout@v4

      - name: Alert owner when provider report audits are stale
        uses: actions/github-script@v7
        with:
          script: |
            const {
              runProviderAnalyticsAuditIntegrationCheck,
              runProviderAnalyticsAuditIntegrationCheckReminder,
              runProviderAnalyticsAuditStaleCheck,
            } = require("./.github/scripts/emergency-production-bypass-alert.cjs");
            if (
              context.eventName === "workflow_dispatch" &&
              context.payload.inputs?.integration_check === "true"
            ) {
              await runProviderAnalyticsAuditIntegrationCheck({ github, context, core });
            } else {
              await runProviderAnalyticsAuditStaleCheck({ github, context, core });
              await runProviderAnalyticsAuditIntegrationCheckReminder({ github, context, core });
            }

  integration_check_failure_alert:
    name: Track repeated provider alert integration check failures
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.integration_check }}
    needs: [monitor]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert implementation
        uses: actions/checkout@v4

      - name: Create or resolve repeated failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const {
              runProviderAnalyticsAuditIntegrationCheckFailureAlert,
            } = require("./.github/scripts/emergency-production-bypass-alert.cjs");
            await runProviderAnalyticsAuditIntegrationCheckFailureAlert({
              github,
              context,
              core,
              currentConclusion: "${{ needs.monitor.result }}",
            });