name: Gemini GitHub AI Agents
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  gemini-agent:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.author_association)) ||
      (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are the AI Engineering Agent for ${{ github.repository }}.
            Event: ${{ github.event_name }} | Number: #${{ github.event.pull_request.number || github.event.issue.number }}
            - pull_request: Review diff for bugs, security/secret leaks, and TypeScript errors; comment via `gh pr comment`.
            - issues: Analyze codebase and post triage plan via `gh issue comment`.
            - issue_comment (@gemini-cli): Follow COMMENT_BODY safely without exposing secrets; implement fixes and open a PR or reply.
