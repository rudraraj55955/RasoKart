kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
# Lightweight liveness check — always returns 200 immediately once the port is
# bound.  Cloud Run startup probes treat any non-2xx response (including 503)
# as a hard probe failure, not a retry signal.  /api/healthz/deep returns
# 503 { status: "starting" } while schemaGuard + seed are running, which
# causes the startup probe to fail before the server finishes initialising.
#
# Safety net for DB failures: main() calls pool.query("SELECT 1") and
# process.exit(1) on failure BEFORE app.listen(), so if the DB is unreachable
# the port never binds and the probe gets connection-refused (which IS retried)
# rather than a spurious 200.
#
# Use /api/healthz/deep for manual monitoring and uptime checks — it returns
# full schema/credential/IAM verification once the server is fully initialised.
path = "/api/healthz"
